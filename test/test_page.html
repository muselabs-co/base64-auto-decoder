    let currentLang = localStorage.getItem('b64_test_lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');

    function renderPage(lang) {
      currentLang = lang;
      localStorage.setItem('b64_test_lang', lang);

      document.getElementById('btn-lang-zh').classList.toggle('active', lang === 'zh');
      document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

      const d = I18N_DATA[lang];
      document.getElementById('title-text').textContent = d.title;

      const container = document.getElementById('test-content');
      container.innerHTML = `
        <div class="card">
          <span class="badge badge-success">${d.c1_badge}</span>
          <p>${d.c1_p1}</p>
          <p>${d.c1_p2}</p>

          <p>${d.c1_p4}</p>
          <p>${d.c1_p5}</p>

          <p>${d.c2_p1}</p>
        </div>

        <div class="card">
          <span class="badge badge-img">${d.c3_badge}</span>
          <p>${d.c3_p1}</p>

        </div>

          <span class="badge badge-warning">${d.c5_badge}</span>
          <p>${d.c5_p1}</p>
          <p>${d.c5_p2}</p>
          <p>${d.c5_p3}</p>
        </div>

        <div class="card">
          <h2>${d.c6_title}</h2>
          <p>${d.c6_desc}</p>
          <button class="test-btn" id="btn-add-dynamic">${d.c6_btn}</button>
          <div id="dynamic-container" style="margin-top: 12px;"></div>
        </div>
      `;

      // Re-bind dynamic button
      document.getElementById('btn-add-dynamic').addEventListener('click', () => {
        const dynContainer = document.getElementById('dynamic-container');
        const p = document.createElement('p');
        p.className = 'code-box';
        p.textContent = `${d.c6_dynamic_prefix} ${new Date().toLocaleTimeString()}] ${d.c6_dynamic_text}`;
        dynContainer.prepend(p);
      });
    }

    document.getElementById('btn-lang-zh').addEventListener('click', () => renderPage('zh'));
    document.getElementById('btn-lang-en').addEventListener('click', () => renderPage('en'));

    // Initial render
    renderPage(currentLang);

      window.chrome = {
        i18n: {
          getMessage: (k) => {
            const table = currentLang === 'en' ? mockEn : mockZh;
            return table[k] || '';
          }
        },
        storage: {
          sync: {
            get: (keys, cb) => cb({ enabled: true, disabledDomains: [] }),
            set: (data, cb) => { if (cb) cb(); }
          },
          onChanged: {
            addListener: () => {}
          }
        },
        runtime: {
          onMessage: {
            addListener: () => {}
          }
        }

      script.src = '../content/content.js';
