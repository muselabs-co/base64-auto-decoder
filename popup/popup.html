<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="popupTitle">Base64 Decoder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    <header class="popup-header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="Logo" class="logo">
        <div class="title-wrap">
          <h1 class="title" data-i18n="popupTitle">Base64 Decoder</h1>
          <span class="badge-version" data-i18n="footerVersion">v1.0.0</span>
        </div>
      </div>
    </header>

    <main class="popup-main">
      <div class="setting-card">
        <div class="setting-info">
          <span class="setting-label" data-i18n="statusLabel">Auto Decode</span>
          <span class="status-indicator status-enabled" id="status-indicator" data-i18n="statusEnabled">Enabled</span>
        </div>
        <label class="switch" for="toggle-switch">
          <input type="checkbox" id="toggle-switch" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Quick Base64 Section -->
      <section class="snippets-section">
        <div class="section-header">
          <span class="section-title" data-i18n="snippetsTitle">常用 Base64 管理</span>
          <span class="snippet-count" id="snippet-count">0</span>
        </div>

        <!-- Add Snippet Form -->
        <form id="add-snippet-form" class="snippet-form">
          <div class="form-row">
            <input type="text" id="input-text" class="input-field" placeholder="输入文本 (如邮箱、URL等)..." data-i18n-placeholder="inputPlaceholder" required autocomplete="off">
          </div>
          <!-- Smart Base64 Decoded Preview Card -->
          <div id="smart-decode-card" class="smart-decode-card hidden">
            <div class="smart-decode-header">
              <div class="smart-decode-badge">
                <svg class="smart-icon" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14c.015-.34.208-.646.477-.859a4 4 0 10-4.954 0c.27.213.462.519.476.859h4.001z" />
                </svg>
                <span data-i18n="smartDecodedLabel">已识别并解码</span>
              </div>
              <div class="smart-decode-actions">
                <button type="button" id="btn-copy-decoded" class="btn-smart-action" title="复制明文">
                  <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg>
                  <span data-i18n="btnCopyPlain">复制明文</span>
                </button>
                <button type="button" id="btn-use-decoded" class="btn-smart-action" title="填入明文">
                  <span data-i18n="btnUsePlain">设为明文</span>
                </button>
              </div>
            </div>
            <div class="smart-decode-content" id="smart-decode-text"></div>
          </div>
          <div class="form-row form-row-inline">
            <input type="text" id="input-tag" class="input-field input-tag" placeholder="标签 (选填)" data-i18n-placeholder="tagPlaceholder" autocomplete="off" maxlength="12">
            <button type="submit" id="btn-add" class="btn-primary" data-i18n="btnAdd">添加</button>
          </div>
        </form>

        <!-- Snippet List -->
        <div id="snippet-list" class="snippet-list">
          <!-- Dynamically populated -->
        </div>
      </section>

      <div class="hint-box">
        <svg class="hint-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
        </svg>
        <span class="hint-text" data-i18n="tipSync">Status syncs across open tabs automatically.</span>
      </div>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
